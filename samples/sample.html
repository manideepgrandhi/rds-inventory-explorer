<script>
/* theme: same "mg-theme" localStorage key as the rest of the site (light | dark | auto) */
(function () {
  var pref = 'auto';
  try { pref = localStorage.getItem('mg-theme') || 'auto'; } catch (e) {}
  var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme-pref', pref);
})();

<style>
[hidden]{display:none !important}
:root{--bg:#f5f7fa;--panel:#fff;--panel2:#f0f3f7;--text:#1c2430;--muted:#5d6b7c;--border:#d8dee6;--accent:#1f6feb;--accent-bg:#e7f0fe;

--ok:#3fb950;--ok-bg:#12261a;--warn:#d29922;--warn-bg:#2b2210;--bad:#f85149;--bad-bg:#2d1416;--shadow:none;--g:#a371f7;--c:#58a6ff;--i:#3fb950;--m:#8d96a0;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 22px 12px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:650}
.gen{color:var(--muted);font-size:12.5px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.search{position:relative;flex:1 1 340px;min-width:260px}
.search input{width:100%;padding:8px 11px;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:7px}

select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:7px 8px;max-width:240px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:440px;overflow:auto;display:none;z-index:20}
.sugg.open{display:block}
.sg{display:flex;gap:10px;align-items:center;padding:7px 11px;cursor:pointer;border-bottom:1px solid var(--border)}
.sg:last-child{border-bottom:0}
.sg.active,.sg:hover{background:var(--accent-bg)}
.sg .nm{font-weight:600}.sg .sub{color:var(--muted);font-size:12px;margin-left:auto;text-align:right}
.sg.none{color:var(--muted);cursor:default}
main{padding:18px 22px 40px;max-width:1400px;margin:0 auto}
.badge{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.02em;padding:1px 7px;border-radius:5px;color:#fff;white-space:nowrap}
.b-global{background:var(--g)}.b-cluster{background:var(--c)}.b-instance{background:var(--i)}.b-member{background:var(--m)}
.pill{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-mute{background:var(--panel2);color:var(--muted)}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--panel2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.list tbody tr{cursor:pointer}.list tbody tr:hover{background:var(--accent-bg)}
.listhead{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.listhead h2{font-size:15px;margin:0}
.card{padding:0;overflow:hidden}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.card-head h2{margin:0;font-size:20px;word-break:break-all}
.card-head .meta{color:var(--muted);font-size:13px;margin-top:4px;display:flex;gap:6px 14px;flex-wrap:wrap}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}
.sec td{white-space:nowrap}.sec td code{word-break:normal}.sec td:nth-child(2) ~ td:last-child{white-space:normal}
.pend td{white-space:normal}.pend td:nth-child(1),.pend td:nth-child(2){white-space:nowrap}
.sec{padding:14px 20px;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.sec.wide{grid-column:1/-1}
.sec h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
dl{display:grid;grid-template-columns:minmax(150px,max-content) 1fr;gap:5px 14px;margin:0}
dt{color:var(--muted)}dd{margin:0;min-width:0;word-break:break-word}
.sec table th{position:static}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{border:1px solid var(--border);border-radius:6px;padding:1px 7px;font-size:12.5px;background:var(--panel2)}
.tag .k{color:var(--muted)}
.back{margin-bottom:12px}
.errors{margin-top:18px}
.errors summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--bad)}
.errors table{font-size:12.5px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:7px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.sources{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:12px;color:var(--muted)}
.sources b{color:var(--fg);font-weight:600}
.sources .src{white-space:nowrap}
.sources .sup{color:var(--warn,#b45309)}
@media (max-width:760px){.sources .src{white-space:normal;overflow-wrap:anywhere}}
footer{color:var(--muted);font-size:12px;text-align:center;padding:10px 0 28px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto}
.tabs{display:flex;gap:2px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--border)}
.tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:9px 14px;color:var(--muted);font-weight:600}
.tab:hover{color:var(--text);border-color:transparent;border-bottom-color:var(--border)}
.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:18px;margin-left:6px;padding:0 6px;border-radius:999px;font-size:11.5px;background:var(--panel2);color:var(--muted)}
.tab .n.warn{background:var(--warn-bg);color:var(--warn)}
.toolbar .export{margin-left:auto}
.pbadge{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--warn-bg);color:var(--warn);white-space:nowrap}
.pbadge:hover{text-decoration:none;outline:1px solid var(--warn)}
.pm-strip{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:150px;text-align:left;cursor:pointer}
.stat b{display:block;font-size:22px;font-weight:650;line-height:1.2}.stat span{color:var(--muted);font-size:12.5px}
.stat.on{outline:2px solid var(--accent);outline-offset:-1px}
.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}
.u{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.u-past_due{background:var(--bad-bg);color:var(--bad)}.u-lt7{background:var(--warn-bg);color:var(--warn)}.u-lt30{background:var(--accent-bg);color:var(--accent)}
.u-later{background:var(--ok-bg);color:var(--ok)}.u-no_date{background:var(--panel2);color:var(--muted)}
.resnote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px;padding:8px 12px}
.pmt th button{all:unset;cursor:pointer}.pmt th button:hover{color:var(--text)}.pmt th[aria-sort] button{color:var(--accent)}
.pmt td{white-space:normal}.pmt td.nw{white-space:nowrap}
.pmt tr.hl td{background:var(--accent-bg)}
.members td{white-space:normal}.members td:nth-child(-n+5){white-space:nowrap}.members td code{word-break:break-all}
@media (max-width:1000px){.sections{grid-template-columns:1fr}}
@media (max-width:760px){
  table.stack thead{display:none}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{border-bottom:1px solid var(--border);padding:6px 0}
  table.stack td,.sec table.stack td{border:0;padding:3px 10px;white-space:normal!important;display:grid;grid-template-columns:minmax(96px,38%) minmax(0,1fr);gap:8px}
  table.stack td::before{content:attr(data-label);color:var(--muted);font-size:12px}
  .tabs{padding:0 6px;overflow-x:auto;scrollbar-width:none}.tab{padding:9px 8px}.toolbar .export{margin-left:0}
}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:14px}
.igrid .panel{padding:10px 14px}.igrid h3{margin:0 0 8px;font-size:13px;color:var(--muted)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:2px 8px;align-items:center;font-size:12.5px;margin:3px 0}
.bar a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.bar i{grid-column:1/3;display:block;height:4px;border-radius:2px;background:var(--accent);opacity:.55}
.tot{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.tot .stat{cursor:default}
.sev{font-weight:600}.sev-High{color:var(--bad)}.sev-Medium{color:var(--warn)}.sev-Low{color:var(--muted)}
.fchip{display:inline-flex;gap:8px;align-items:center;margin-left:10px}
#in-table td:nth-child(2),#in-table td:nth-child(3){white-space:nowrap}
.seg{display:inline-flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed=true]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent);position:relative}
.chk{display:inline-flex;gap:5px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.pres{margin-bottom:10px;overflow:hidden}.pmem{margin-left:28px}.hlres{outline:2px solid var(--accent)}
.phead{padding:9px 14px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.phead > a{font-weight:650}.pmeta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12.5px;margin-left:6px}
.pmsg{padding:14px}.pnotes{font-size:12.5px;margin:0 0 10px}
code.nd{background:var(--warn-bg);color:var(--warn);padding:0 4px;border-radius:4px}
.flag{font-size:11.5px}.from{font-size:12px}.from-instance{color:var(--i)}.from-cluster{color:var(--c)}.from-default{color:var(--muted)}
.ptab td:nth-child(1){white-space:nowrap}
.bl{display:inline-block;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.bl-pass{background:var(--ok-bg);color:var(--ok)}.bl-fail{background:var(--bad-bg);color:var(--bad)}.bl-missing{background:var(--warn-bg);color:var(--warn)}
.bl-na,.bl-unknown{background:var(--panel2);color:var(--muted)}
.bdg{display:inline-flex;gap:4px;align-items:center}.bdg .pill{font-size:11.5px}.bdg-mem{color:var(--muted);font-size:12px}
.bloff{border-left:3px solid var(--bad)}.blok{border-left:3px solid var(--ok)}
tr.bl-row-fail td,tr.bl-row-missing td{background:color-mix(in srgb,var(--bad-bg) 55%,transparent)}
.chip.bl-chip{cursor:pointer;white-space:normal}
@media (max-width:760px){.pmem{margin-left:12px}.seg{flex-wrap:wrap}}
#px-q{flex:1 1 260px;min-width:180px;max-width:420px}
.plegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:0 0 10px}
.plegend span{display:inline-flex;align-items:center;gap:5px}.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--border)}
.sw.s-bad,.st-bad{background:var(--bad-bg);color:var(--bad)}.sw.s-warn,.st-warn{background:var(--warn-bg);color:var(--warn)}.sw.s-na,.st-na{background:var(--panel2);color:var(--muted)}
.st{display:inline-block;padding:0 7px;border-radius:5px;font-size:12px;font-weight:600;white-space:nowrap}.st-ok{color:var(--ok)}

.pblsum{font-size:12.5px;color:var(--muted);margin:0 0 8px;display:flex;flex-wrap:wrap;gap:4px 16px}
.prow{cursor:pointer;user-select:none}.prow:hover{background:var(--panel2)}.prow .tw{display:inline-block;width:14px;color:var(--muted)}
.pres.p-bad,.pres.p-warn{background:var(--panel);color:var(--text)}.pres.p-bad{border-left:3px solid var(--bad)}.pres.p-warn{border-left:3px solid var(--warn)}
.pmembers{margin:0 0 10px 28px}.mtoggle{font-size:12.5px;margin:0 0 8px 28px}
.pdiff{outline:1px dashed var(--warn)}.cmp{font-size:12px;margin-left:6px}
.cmpbox{padding:8px 10px;background:var(--panel2);border-radius:6px;margin:4px 0}
.cmpbox .cv{margin:2px 0}.pcount{margin:0 0 8px;font-size:13px}
.ind{padding-left:22px}
@media (max-width:760px){.pmembers,.mtoggle{margin-left:12px}#px-q{max-width:none}}
.ptab code,.cmpbox code{color:inherit}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font:inherit}
@media (max-width:700px){dl{grid-template-columns:1fr}dt{margin-top:6px}}
</style>

  <button type="button" class="tab" role="tab" id="tab-insights" aria-controls="view">Insights</button>

    <div class="sugg" id="sugg" role="listbox"></div>
  </div>
  <select id="f-account" aria-label="Account"></select>

  <select id="f-engine" aria-label="Engine"></select>

</div>
<div class="toolbar" id="pm-toolbar" hidden>
  <div class="search">
    <input id="pq" type="search" autocomplete="off" spellcheck="false" placeholder="Search resource, action, description, account, region…" aria-label="Search pending actions">
  </div>
  <select id="pf-account" aria-label="Account"></select>
  <select id="pf-region" aria-label="Region"></select>
  <select id="pf-action" aria-label="Action type"></select>
  <select id="pf-urgency" aria-label="Urgency"></select>
  <button type="button" id="pclear">Clear</button>
  <button type="button" id="pm-csv" class="export" title="Download the actions shown (filters + search + sort) as CSV">Export CSV</button>
</div>
<div class="toolbar" id="in-toolbar" hidden>
  <select id="if-account" aria-label="Account"></select>
  <select id="if-region" aria-label="Region"></select>
  <select id="if-check" aria-label="Check"></select>
  <select id="if-sev" aria-label="Severity"></select>
  <button type="button" id="iclear">Clear</button>
  <button type="button" id="in-csv" class="export" title="Download the findings shown (filters) as CSV">Export CSV</button>
</div>
<div class="toolbar" id="px-toolbar" hidden>
  <span class="seg" role="group" aria-label="Parameters view"><button type="button" id="pv-resource">By resource</button><button type="button" id="pv-group">By parameter group</button></span>
  <input type="search" id="px-q" placeholder="Search cluster, instance, group, parameter or value  ( / )" aria-label="Search parameters" autocomplete="off" spellcheck="false">
  <select id="xf-account" aria-label="Account"></select>
  <select id="xf-region" aria-label="Region"></select>
  <select id="xf-engine" aria-label="Engine"></select>
  <select id="xf-level" aria-label="Level"><option value="">Level: all (effective values)</option><option value="cluster">Level: cluster group</option><option value="instance">Level: instance group</option></select>
  <select id="xf-bparam" aria-label="Baseline parameter"></select>
  <select id="xf-show" aria-label="Show"><option value="">Show: all parameters</option><option value="problems">Show: problems only</option><option value="changed">Show: changed from default</option></select>
  <button type="button" id="xclear">Clear</button>
  <button type="button" id="px-csv" class="export" title="Download what is on screen (view, filters, level, search) as CSV">Export CSV</button>
  <button type="button" id="px-bcsv" class="export2" title="Download the baseline results shown as CSV - same columns as the script's _baseline.csv">Baseline CSV</button>
</div>
<main>
  <div id="view"></div>
  <div id="errors-wrap"></div>
</main>
<footer id="foot"></footer>

    if (o.tab === 'parameters') { closeSugg(); renderParams(o); return; }
    var r = current();
    if (o.id && !r) {
      view.textContent = '';
      view.appendChild(h('div', { cls: 'panel empty', text: 'That resource is not in this report.' }));
      return;
    }
    if (!r) { document.title = 'RDS Inventory Explorer'; renderList(); return; }
    view.textContent = '';
    view.appendChild(h('div', { cls: 'back' }, h('button', { type: 'button', id: 'back', onclick: function () { history.pushState(null, '', location.pathname + location.search); render(); } }, '← All resources')));
    view.appendChild(r.type === 'global' ? globalCard(r) : r.type === 'cluster' ? clusterCard(r) : instanceCard(r));
    document.title = r.name + ' - RDS Inventory Explorer';
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', render);
  window.addEventListener('popstate', render);

  /* ---------- header, errors, theme ---------- */
  var MG = M.merge || null;
  $('gen').textContent = (MG ? 'Merged ' : 'Generated ') + M.generated_utc + '  ·  ' + M.generated_local + (MG ? '  ·  from ' + MG.files + ' file(s)' : '');
  if (MG) {
    var sw = $('sources'); sw.hidden = false;
    sw.appendChild(h('span', { text: 'Sources (collected):' }));
    (MG.sources || []).forEach(function (x) {
      var sp = h('span', { cls: 'src', title: 'accounts in file: ' + x.accounts.join(', ') },
        h('b', { text: x.file }), ' ' + (x.generated_utc || '') + (x.generated_local ? ' · ' + x.generated_local : '') +
        ' · ' + x.used.length + ' account(s)');
      if (x.superseded.length) sp.appendChild(h('span', { cls: 'sup', text: ' · ' + x.superseded.length + ' older duplicate(s) ignored: ' + x.superseded.join(', ') }));
      sw.appendChild(sp);
    });
  }
  function chip(n, label, cls, title) { return h('span', { cls: 'chip' + (cls ? ' ' + cls : ''), title: title || null }, h('b', { text: String(n) }), ' ' + label); }
  var counts = $('counts');
  counts.appendChild(chip(C.accounts, C.accounts === 1 ? 'account' : 'accounts'));
  counts.appendChild(chip(C.regions_with_databases, 'region(s) with databases', null, 'account + region pairs that have at least one DB; empty regions are not listed'));
  counts.appendChild(chip(C.global_clusters, 'global cluster(s)'));
  counts.appendChild(chip(C.clusters, 'cluster(s)'));
  counts.appendChild(chip(C.instances, 'instance(s)  (' + C.standalone_instances + ' standalone · ' + C.cluster_members + ' cluster members)'));
  if (BL.applied) {
    var bc = chip(BL.totals.off + ' of ' + BL.totals.resources, 'off baseline  (' + BL.file + ' · sha256 ' + BL.sha_short + ')', BL.totals.off ? 'warnc bl-chip' : 'bl-chip',
      'Parameter baseline ' + BL.file + ', sha256 ' + BL.sha256 + ', ' + BL.rules + ' rule(s). Show the problems in the Parameters tab');
    bc.id = 'bl-chip'; bc.addEventListener('click', function () { go({ tab: 'parameters', sh: 'problems' }); }); counts.appendChild(bc);
  }
  if (C.pending_maintenance) counts.appendChild(chip(C.pending_maintenance, 'with pending maintenance', 'warnc'));
  if (C.errors) { var ec = chip(C.errors, 'error(s)', 'err', 'Show errors'); ec.id = 'err-chip'; ec.addEventListener('click', function () { var d = $('errors'); d.open = true; d.scrollIntoView(); }); counts.appendChild(ec); }
  if (ERR.length) {
    $('errors-wrap').appendChild(h('details', { cls: 'panel errors', id: 'errors' },
      h('summary', { text: ERR.length + ' error(s) while collecting - the affected account / region data may be incomplete' }),
      table(['Account', 'Profile', 'Region', 'Call', 'Message'], ERR.map(function (e) { return [e.account, e.profile, e.region, h('code', { text: e.call }), e.message]; }))));
  }
  $('foot').textContent = M.script + ' v' + M.version + '  ·  read-only (rds describe-* only, no CloudWatch)  ·  ' + (M.merge ? 'merged offline from saved data, 0 AWS calls' : (M.aws_calls || 0) + ' AWS calls') + (DATA.parameters && DATA.parameters.collected ? '  ·  parameter step ' + ((DATA.parameters.elapsed_ms || 0) / 1000).toFixed(3) + ' s' : '') + '  ·  times shown in UTC and ' + M.tz + '  ·  works offline';

  var tb = $('theme-btn');
  function themeLabel() { var p = document.documentElement.getAttribute('data-theme-pref') || 'auto'; tb.textContent = 'Theme: ' + p; }
  function applyTheme(p) {
    var dark = p === 'dark' || (p === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme-pref', p);
    try { localStorage.setItem('mg-theme', p); } catch (e) {}
    themeLabel();
  }
  tb.addEventListener('click', function () {
    var order = ['auto', 'light', 'dark'], p = document.documentElement.getAttribute('data-theme-pref') || 'auto';
    applyTheme(order[(order.indexOf(p) + 1) % 3]);
  });
  if (window.matchMedia) { var mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', function () { if ((document.documentElement.getAttribute('data-theme-pref') || 'auto') === 'auto') applyTheme('auto'); }); }
  themeLabel();
  render();
})();
</script>
</body>
</html>
